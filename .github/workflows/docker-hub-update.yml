name: Build and Push Docker Image

# Trigger: git tag v* (e.g. v2.0.0). Pushes that exact Hub tag only.
# There is no :latest. Pin cartagodocker/zsh:vX.Y.Z in child Dockerfiles.
#
# Also creates a GitHub Release for the same tag. If a release already
# exists (debug: delete git tag, fix, re-push the same version), it is
# deleted and recreated. Hub is not overwritten: if the tag already
# exists there, the push is skipped (delete it on Hub yourself to republish).

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              # Pin to SHA for supply-chain security. v5.1.0 uses Node 24
              # (GitHub is deprecating Node 20 in actions/checkout v4.x).
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - name: Set up Docker Buildx
              # v4.3.0
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

            - name: Log in to Docker Hub
              # v4.6.0
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Set image tags
              run: |
                  echo "VERSION_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
                  echo "IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

            - name: Check if the tag exists on Docker Hub
              id: hub-tag
              run: |
                  TAG_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}/tags/${{ env.VERSION_TAG }}/")
                  if [ "$TAG_EXISTS" -eq 200 ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "::warning::Hub tag ${{ env.VERSION_TAG }} already exists — skip push. Delete it on Hub to republish."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build Docker image
              if: steps.hub-tag.outputs.exists != 'true'
              run: |
                  VERSION="${VERSION_TAG#v}"
                  docker build --build-arg "VERSION=${VERSION}" \
                    -t "${{ env.IMAGE_TAG }}" .

            - name: Push Docker image
              if: steps.hub-tag.outputs.exists != 'true'
              run: |
                  docker push "${{ env.IMAGE_TAG }}"

            - name: Create or replace GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TAG="${VERSION_TAG}"
                  VER="${TAG#v}"
                  NOTES="/tmp/release-notes.md"

                  {
                      echo "## Docker Hub"
                      echo
                      echo "- \`${{ env.IMAGE_TAG }}\`"
                      echo
                      if [ -f CHANGELOG.md ]; then
                          SECTION=$(awk -v ver="$VER" '
                              $0 ~ "^## \\[" ver "\\]" {found=1; print; next}
                              found && /^## \[/ {exit}
                              found {print}
                          ' CHANGELOG.md)
                          if [ -n "$SECTION" ]; then
                              echo "$SECTION"
                          else
                              echo "See [CHANGELOG.md](./CHANGELOG.md)."
                          fi
                      else
                          echo "See [CHANGELOG.md](./CHANGELOG.md)."
                      fi
                  } > "$NOTES"

                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "GitHub Release $TAG exists — deleting to recreate (overwrite)."
                      gh release delete "$TAG" --yes
                  fi

                  gh release create "$TAG" \
                      --title "$TAG" \
                      --notes-file "$NOTES" \
                      --target "${GITHUB_SHA}"
