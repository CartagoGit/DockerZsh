name: Build and Push Docker Image

# Trigger: git tag v* (e.g. v2.0.0). Pushes that exact Hub tag only.
# There is no :latest. Pin cartagodocker/zsh:vX.Y.Z in child Dockerfiles.

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              # Pin to SHA for supply-chain security. v5.1.0 uses Node 24
              # (GitHub is deprecating Node 20 in actions/checkout v4.x).
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

            - name: Set up Docker Buildx
              # v4.3.0
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

            - name: Log in to Docker Hub
              # v4.6.0
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Set image tags
              run: |
                  echo "VERSION_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
                  echo "IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

            - name: Check if the tag exists on Docker Hub
              run: |
                  TAG_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}/tags/${{ env.VERSION_TAG }}/")
                  if [ "$TAG_EXISTS" -eq 200 ]; then
                      echo "Tag already exists, skipping push"
                      exit 1
                  fi

            - name: Build Docker image
              run: |
                  VERSION="${VERSION_TAG#v}"
                  docker build --build-arg "VERSION=${VERSION}" \
                    -t "${{ env.IMAGE_TAG }}" .

            - name: Push Docker image
              run: |
                  docker push "${{ env.IMAGE_TAG }}"
