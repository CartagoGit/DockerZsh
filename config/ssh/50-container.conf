# cartagodocker/zsh — client defaults. No sshd.
# User keys are never baked. Bind-mount host ~/.ssh; ssh-wrap copies
# them so OpenSSH does not see 644/777 / :ro.
#
# known_hosts:
#   GlobalKnownHostsFile = official GitHub/GitLab keys baked in the image
#     (/usr/share/ssh/known_hosts AND /etc/ssh/ssh_known_hosts — same file).
#   UserKnownHostsFile   = ssh-wrap overrides this with
#     /tmp/container-ssh-<uid>/known_hosts (host file copy + accept-new).
#     Writable path first: /usr/bin/ssh (no wrapper) cannot append to a
#     :ro ~/.ssh/known_hosts bind.
Host *
  HashKnownHosts no
  StrictHostKeyChecking accept-new
  GlobalKnownHostsFile /usr/share/ssh/known_hosts /etc/ssh/ssh_known_hosts
  UserKnownHostsFile /tmp/container-ssh-known-hosts ~/.ssh/known_hosts
  IdentitiesOnly no
  AddKeysToAgent no
  ForwardAgent no
